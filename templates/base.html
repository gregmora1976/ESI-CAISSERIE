<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESI Caisserie</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>
  /* Champs en bleu - palette ESI */
  input:not([type="hidden"]),
  select,
  textarea {
    border: 1px solid #bae6fd !important;
    background: #e0f2fe !important;
    color: #1e293b !important;
    transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }

  input:not([type="hidden"]):hover,
  select:hover,
  textarea:hover {
    border-color: #7dd3fc !important;
    background: #d7effc !important;
  }

  input:not([type="hidden"]):focus,
  select:focus,
  textarea:focus {
    outline: none !important;
    border-color: #0ea5e9 !important;
    box-shadow: 0 0 0 3px rgba(14, 165, 233, .18) !important;
    background: #e0f2fe !important;
  }
</style>

</head>
<body data-page="{{ active|default('') }}">
<header class="topbar">
  <a href="/emballage" class="brand"><img src="{{ url_for('static', filename='logo_esi.png') }}" class="logo-img" alt="ESI"><div><strong>ESI Caisserie</strong><span>Fabrication • Devis • Planning</span></div></a>
  <nav>
    <a class="{{ 'active' if active=='emballage' else '' }}" href="/emballage">Emballage</a>
    <a class="{{ 'active' if active=='devis' else '' }}" href="/devis">Devis</a>
    <a class="{{ 'active' if active=='caisserie' else '' }}" href="/caisserie">Caisserie</a>
    <a class="{{ 'active' if active=='planning' else '' }}" href="/planning">Planning</a>
    <a class="{{ 'active' if active=='modeles' else '' }}" href="/modeles-caisses">Modèles</a>
    <a class="{{ 'active' if active=='superviseur' else '' }}" href="/superviseur">Superviseur</a>
  </nav>
</header>
<main class="container">
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
