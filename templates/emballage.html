{% set active='emballage' %}{% extends "base.html" %}{% block content %}
<div class="page-title"><h1>Emballage</h1><p>Création et suivi des ordres de fabrication.</p></div>

<div class="layout two emballage-layout">
  <section class="panel">
    <h2>Liste demandes</h2>
    <div class="filters">
      <button onclick="loadEmballage('')">Toutes</button>
      <button onclick="loadEmballage('A créer')">À créer</button>
      <button onclick="loadEmballage('En cours')">En cours</button>
      <button onclick="loadEmballage('Caisse prête')">Prêtes</button>
    </div>
    <div id="emballageList" class="emballage-list"></div>
  </section>

  <section class="panel">
    <div class="panel-title-row">
      <h2 id="emballageFormTitle">Nouvelle demande</h2>
      <button class="secondary" type="button" onclick="newEmballage()">+ Nouvelle demande</button>
    </div>

    <form id="caisseForm" class="form-grid">
      <input type="hidden" id="emballageEditId">

      <label>N° dossier<input name="numero_dossier" required></label>
      <label>Colis n°<input name="numero_colis"></label>
      <label>Client<input name="client"></label>
      <label>Référence<input name="reference"></label>
      <label>Destination<input name="destination"></label>
      <label>Chargé de projet<input name="charge_projet"></label>

      <label>Type caisse
        <select name="type_caisse">
          {% for t in types %}<option>{{t}}</option>{% endfor %}
        </select>
      </label>

      <label>Statut
        <select name="statut">
          <option>A créer</option>
          <option>En cours</option>
          <option>Caisse prête</option>
          <option>Annulée</option>
        </select>
      </label>

      <label>Longueur int. cm<input name="longueur" type="number" step="0.1"></label>
      <label>Largeur int. cm<input name="largeur" type="number" step="0.1"></label>
      <label>Hauteur int. cm<input name="hauteur" type="number" step="0.1"></label>
      <label>Poids net<input name="poids_net"></label>
      <label>Délai demandé<input name="delai_demande" type="date"></label>

      <label class="full">Bons d’entrée ou nature marchandises<textarea name="nature_marchandises"></textarea></label>
      <label class="full">Observations<textarea name="observations"></textarea></label>

      <div class="full filters">
        <button class="primary" id="emballageSubmitBtn" type="submit">Créer la demande</button>
        <button type="button" onclick="newEmballage()">Réinitialiser</button>
      </div>
    </form>
  </section>
</div>
{% endblock %}
