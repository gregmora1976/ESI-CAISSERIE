{% set active='planning' %}{% extends "base.html" %}{% block content %}
<div class="page-title"><h1>Planning</h1><p>Vue semaine ou mois de la charge caisserie.</p></div>
<section class="panel">
  <style>
    .planning-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
    .planning-toolbar input{flex:1;min-width:260px}
    .planning-toolbar button.active{background:#dff1ff;color:#003b63;font-weight:700}
    .planning-month{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
    .planning-week{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
    .month-head{font-weight:700;text-align:center;color:#003b63;padding:6px 0}
    .month-day{min-height:135px}
    .month-empty{background:transparent;border:none;box-shadow:none}
    @media(max-width:1100px){.planning-month{grid-template-columns:repeat(2,1fr)}.planning-week{grid-template-columns:1fr}}
  </style>
  <div class="planning-toolbar">
    <input id="searchPlanning" placeholder="Recherche dossier, client, chargé..." oninput="renderPlanning()">
    <button id="btnWeek" onclick="setPlanningMode('week')">Semaine</button>
    <button id="btnMonth" onclick="setPlanningMode('month')">Mois</button>
    <button onclick="changePeriod(-1)">Précédent</button>
    <button onclick="changePeriod(1)">Suivant</button>
  </div>
  <div class="legend" style="display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 12px;">
    <span><b style="color:#2563eb">●</b> À créer</span>
    <span><b style="color:#f97316">●</b> En cours</span>
    <span><b style="color:#16a34a">●</b> Caisse prête</span>
    <span><b style="color:#64748b">●</b> Annulée</span>
  </div>
  <div id="weekLabel" class="week-label"></div>
  <div id="planningGrid" class="planning planning-week"></div>
</section>
{% endblock %}
