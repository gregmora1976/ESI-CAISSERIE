{% set active='caisserie' %}{% extends "base.html" %}{% block content %}

<style>
  /* Champs en bleu - palette ESI */
  input:not([type="hidden"]),
  select,
  textarea {
    border: 1px solid #bae6fd !important;
    background: #e0f2fe !important;
    color: #1e293b !important;
    transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }

  input:not([type="hidden"]):hover,
  select:hover,
  textarea:hover {
    border-color: #7dd3fc !important;
    background: #d7effc !important;
  }

  input:not([type="hidden"]):focus,
  select:focus,
  textarea:focus {
    outline: none !important;
    border-color: #0ea5e9 !important;
    box-shadow: 0 0 0 3px rgba(14, 165, 233, .18) !important;
    background: #e0f2fe !important;
  }
</style>

<div class="page-title"><h1>Caisserie</h1><p>Traitement atelier, débit et suivi de fabrication.</p></div>
<div class="layout two">
  <section class="panel">
    <h2>Liste atelier</h2>
    <div class="filters"><button onclick="loadAtelier('')">Toutes</button><button onclick="loadAtelier('A créer')">À créer</button><button onclick="loadAtelier('En cours')">En cours</button><button onclick="loadAtelier('Caisse prête')">Prêtes</button></div>
    <div id="atelierList"></div>
  </section>
  <section class="panel">
    <h2>Détail</h2>
    <div id="atelierDetail" class="empty">Sélectionner une caisse.</div>
  </section>
</div>
{% endblock %}
