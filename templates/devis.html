{% set active='devis' %}{% extends "base.html" %}{% block content %}

<style>
  /* Champs en bleu - palette ESI */
  input:not([type="hidden"]),
  select,
  textarea {
    border: 1px solid #bae6fd !important;
    background: #e0f2fe !important;
    color: #1e293b !important;
    transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }

  input:not([type="hidden"]):hover,
  select:hover,
  textarea:hover {
    border-color: #7dd3fc !important;
    background: #d7effc !important;
  }

  input:not([type="hidden"]):focus,
  select:focus,
  textarea:focus {
    outline: none !important;
    border-color: #0ea5e9 !important;
    box-shadow: 0 0 0 3px rgba(14, 165, 233, .18) !important;
    background: #e0f2fe !important;
  }
</style>

<div class="page-title"><h1>Demande devis</h1><p>Calcul estimatif à partir du débit matière et des paramètres tarifaires.</p></div>
<div class="layout two">
  <section class="panel">
    <h2>Informations caisse</h2>
    <form id="devisForm" class="form-grid">
      <label>N° dossier<input name="numero_dossier"></label>
      <label>Colis n°<input name="numero_colis"></label>
      <label>Client<input name="client"></label>
      <label>Chargé de projet<input name="charge_projet"></label>
      <label>Type caisse<select name="type_caisse">{% for t in types %}<option>{{t}}</option>{% endfor %}</select></label>
      <label>Longueur int. cm<input name="longueur" type="number" step="0.1"></label>
      <label>Largeur int. cm<input name="largeur" type="number" step="0.1"></label>
      <label>Hauteur int. cm<input name="hauteur" type="number" step="0.1"></label>
      <label class="full">Observations<textarea name="observations"></textarea></label>
      <button class="primary" type="button" onclick="calculateQuote()">Calculer</button>
      <button class="success" type="button" onclick="createFromQuote()">Créer la demande</button>
    </form>
  </section>
  <section class="panel">
    <h2>Résultat</h2>
    <div id="quoteResult" class="empty">Renseigner les dimensions puis cliquer sur Calculer.</div>
    <h3>Paramètres</h3>
    <div id="priceForm" class="price-grid"></div>
    <button class="secondary" onclick="savePrices()">Enregistrer les tarifs</button>
  </section>
</div>
{% endblock %}
